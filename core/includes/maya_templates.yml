#
# This file is one of the central points in the Shotgun Pipeline Toolkit configuration and
# a counterpart to the folder configuration structure.
#
# The folder structure underneath the project folder is used to create folders on disk -
# templates.yml (this file) refers to those folders. Therefore, the two files need to be
# in sync. This file contains an overview of all locations that are used by Sgtk.
#
# Whenever an app or an engine refers to a location on disk, it is using an entry defined in
# this file. For more information, see the Shotgun Pipeline Toolkit Documentation.

keys:
    maya.layer_name:
        type: str
        filter_by: '^[0-9a-zA-Z_]+$'

    maya.techpass_name:
        alias: tech_pass
        type: str
        filter_by: alphanumeric

    # Maya supports two extension types.
    maya_extension:
        type: str
        choices:
            ma: Maya Ascii (.ma)
            mb: Maya Binary (.mb)
        default: ma
        alias: extension

paths:
    ##############
    # Work Files #
    ##############
    # define the location of a work area
    maya_shot_work_area:
        definition: '@shot_work_file_root/maya'
        root_name: 'project_storage'

    maya_asset_work_area:
        definition: '@asset_work_file_root/maya'
        root_name: 'asset_storage'

    # The location of WIP files
    maya_shot_work:
        definition: '@maya_shot_work_area/{Shot}_{task_name}[_{name}]_v{version}.{maya_extension}'
        root_name: 'project_storage'

    maya_asset_work:
        definition: '@maya_asset_work_area/{Asset}_{task_name}[_{name}]_v{version}.{maya_extension}'
        root_name: 'asset_storage'

    # The location of backups of WIP files
    maya_shot_snapshot:
        definition: '@maya_shot_work_area/snapshots/{Shot}_{task_name}[_{name}]_v{version}_{timestamp}.{maya_extension}'
        root_name: 'project_storage'

    maya_asset_snapshot:
        definition: '@maya_asset_work_area/snapshots/{Asset}_{task_name}[_{name}]_v{version}_{timestamp}.{maya_extension}'
        root_name: 'asset_storage'

    # define the location of a publish area
    maya_shot_publish_area:
        definition: '@shot_work_file_publish_root/maya'
        root_name: 'project_storage'

    maya_asset_publish_area:
        definition: '@asset_work_file_publish_root/maya'
        root_name: 'asset_storage'

    # The location of published maya files
    maya_shot_publish:
        definition: '@maya_shot_publish_area/{Shot}_{task_name}[_{name}]_v{version}.{maya_extension}'
        root_name: 'project_storage'

    maya_asset_publish:
        definition: '@maya_asset_publish_area/{Asset}_{task_name}[_{name}]_v{version}.{maya_extension}'
        root_name: 'asset_storage'

    ###########
    # Renders #
    ###########
    # Render working location.
    maya_shot_render_root:
        definition: '@shot_render_root/maya'
        root_name: 'project_storage'

    maya_asset_render_root:
        definition: '@asset_render_root/maya'
        root_name: 'asset_storage'

    # Render publish location.
    maya_shot_render_publish_root:
        definition: '@shot_render_publish_root/maya'
        root_name: 'project_storage'

    maya_asset_render_publish_root:
        definition: '@asset_render_publish_root/maya'
        root_name: 'asset_storage'

    # EXRs.
    maya_shot_render_exr:
        definition: '@maya_shot_render_publish_root/version/{Shot}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Shot}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.exr'
        root_name: 'project_storage'

    maya_asset_render_exr:
        definition: '@maya_asset_render_publish_root/version/{Asset}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Asset}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.exr'
        root_name: 'asset_storage'

    # Multi EXRs.
    maya_shot_render_multi_exr:
        definition: '@maya_shot_render_publish_root/version/{Shot}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{pass_group}/{Shot}_{task_name}[_{maya.layer_name}]_v{version}_{pass_group}.{SEQ}.exr'
        root_name: 'project_storage'

    maya_asset_render_multi_exr:
        definition: '@maya_asset_render_publish_root/version/{Asset}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{pass_group}/{Asset}_{task_name}[_{maya.layer_name}]_v{version}_{pass_group}.[{SEQ}.]exr'
        root_name: 'asset_storage'

    # JPGs.
    maya_shot_render_jpg:
        definition: '@maya_shot_render_publish_root/version/{Shot}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Shot}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.jpg'
        root_name: 'project_storage'

    maya_asset_render_jpg:
        definition: '@maya_asset_render_publish_root/version/{Asset}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Asset}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.jpg'
        root_name: 'asset_storage'

    # Playblast JPGs.
    # Playblast tool automatically adds extension and frame numbers, so a template
    # without these elements is required for generation.
    maya_shot_playblast_output:
        definition: '@maya_shot_render_publish_root/playblast/{Shot}_{task_name}[_{maya.techpass_name}][_{name}]_pb_v{version}/{Shot}_{task_name}[_{maya.techpass_name}][_{name}]_pb_v{version}'
        root_name: 'project_storage'

    maya_asset_playblast_output:
        definition: '@maya_asset_render_publish_root/playblast/{Asset}_{task_name}[_{maya.techpass_name}][_{name}]_pb_v{version}/{Asset}_{task_name}[_{maya.techpass_name}][_{name}]_pb_v{version}'
        root_name: 'asset_storage'

    # Templates including frames and extension used by the submitter tool.
    maya_shot_playblast_publishing:
        definition: '@maya_shot_playblast_output.{SEQ}.jpg'
        root_name: 'project_storage'

    maya_asset_playblast_publishing:
        definition: '@maya_asset_playblast_output.{SEQ}.jpg'
        root_name: 'asset_storage'

    # PNGs.
    maya_shot_render_png:
        definition: '@maya_shot_render_publish_root/maya/version/{Shot}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Shot}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.png'
        root_name: 'project_storage'

    maya_asset_render_png:
        definition: '@maya_asset_render_publish_root/maya/version/{Asset}_{task_name}[_{name}]_v{version}/[{maya.layer_name}/]{Asset}_{task_name}[_{maya.layer_name}]_v{version}.{SEQ}.png'
        root_name: 'asset_storage'

    ###########
    # Exports #
    ###########
    # the location of Maya published json files
    maya_shot_json_publish:
        definition: '@shot_export_publish_root/maya/json/{Shot}_{task_name}[_{name}]_v{version}.json'
        root_name: 'project_storage'

    maya_asset_json_publish:
        definition: '@asset_export_publish_root/maya/json/{Asset}_{task_name}[_{name}]_v{version}.json'
        root_name: 'asset_storage'

    # The location of published maya shader files
    maya_shader_network_publish:
        definition: '@asset_export_publish_root/maya/surf/{Asset}_{task_name}[_{name}]_v{version}.{maya_extension}'
        root_name: 'asset_storage'

    # The location of published maya assembly definition files
    maya_asset_assembly_publish:
        definition: '@asset_export_publish_root/maya/assembly/{Asset}_{task_name}[_{name}]_assembly_v{version}.{maya_extension}'
        root_name: 'asset_storage'

    ##########
    # Caches #
    ##########
    # Published Camera caches.
    maya_shot_camera_publish:
        definition: '@shot_cache_root/maya/camera/{Shot}_{task_name}[_{name}]_v{version}.abc'
        root_name: 'caches'

    maya_asset_camera_publish:
        definition: '@asset_cache_root/maya/camera/{Asset}_{task_name}[_{name}]_v{version}.abc'
        root_name: 'caches'

    # Geo cache, '.mcx' (Mastercam X) is a 3d model format.
    maya_shot_cache_geo:
        definition: '@shot_cache_root/maya/n_cache/{Shot}_{task_name}[_{name}]_v{version}/{Shot}_{task_name}[_{name}]_v{version}.{SEQ}.mcx'
        root_name: 'caches'

    maya_asset_cache_geo:
        definition: '@asset_cache_root/maya/n_cache/{Asset}_{task_name}[_{name}]_v{version}/{Asset}_{task_name}[_{name}]_v{version}.{SEQ}.mcx'
        root_name: 'caches'

    # Alembic cache folder.
    # TODO: This looks like these are only used for display. Can probably be removed and replaced with the full render path.
    maya_shot_cache_alembic:
        definition: '@shot_cache_root/maya/alembic/{Shot}_{task_name}_alembic-cache[_{name}]_v{version}'
        root_name: 'caches'

    maya_asset_cache_alembic:
        definition: '@asset_cache_root/maya/alembic/{Asset}_{task_name}_alembic-cache[_{name}]_v{version}'
        root_name: 'caches'

    # Alembic cache outputs.
    # TODO: Names of templates should match.
    maya_shot_cache_alembic_abc:
        definition: '@shot_cache_root/maya/alembic/{Shot}_{task_name}_alembic-cache[_{name}]_v{version}/{Shot}_{task_name}_alembic-cache[_{name}]_v{version}.abc'
        root_name: 'caches'

    maya_asset_cache_alembic_file:
        definition: '@asset_cache_root/maya/alembic/{Asset}_{task_name}_alembic-cache[_{name}]_v{version}/{Asset}_{task_name}_alembic-cache[_{name}]_v{version}.abc'
        root_name: 'caches'

    # Obj outputs.
    # TODO: Names of templates should match.
    maya_shot_cache_obj:
        definition: '@shot_cache_root/maya/obj/{Shot}_{task_name}_obj_cache[_{name}]_v{version}/{Shot}_{task_name}_obj-cache[_{name}]_v{version}.obj'
        root_name: 'caches'

    maya_asset_cache_obj_file:
        definition: '@asset_cache_root/maya/obj/{Asset}_{task_name}_obj_cache[_{name}]_v{version}/{Asset}_{task_name}_obj_cache[_{name}]_v{version}.obj'
        root_name: 'caches'

    # Standin exports.
    maya_shot_cache_standin_ass:
        definition: '@shot_cache_root/maya/standin/{Shot}_{task_name}_standin_cache[_{name}]_v{version}/{Shot}_{task_name}_standin-cache[_{name}]_v{version}[.{SEQ}].ass'
        root_name: 'caches'

    maya_asset_cache_standin_file:
        definition: '@asset_cache_root/maya/standin/{Asset}_{task_name}_standin_cache[_{name}]_v{version}/{Asset}_{task_name}_standin_cache[_{name}]_v{version}[.{SEQ}].ass'
        root_name: 'caches'

    # Bitfrost outputs.
    maya_shot_cache_bifrost:
        definition: '@shot_cache_root/maya/bifrost/{Shot}_{task_name}[_{name}]_v{version}/{Shot}_{task_name}_v{version}.{SEQ}.bif'
        root_name: 'caches'

    # Simulation outputs.
    # '.fxd' extension used for FumeFX exports.
    maya_shot_sim_ffx:
        definition: '@shot_cache_root/maya/sim/{Shot}_{task_name}[_{name}]_v{version}/{Shot}_{task_name}[_{name}]_v{version}.{SEQ}.fxd'
        root_name: 'caches'
