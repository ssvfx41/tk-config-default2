keys:
    3dsmax.render.output:
        alias: output
        type: str
        filter_by: alphanumeric

    3dsmax.cache.output:
        alias: output
        type: str
        filter_by: alphanumeric

paths:
    ##############
    # Work Files #
    ##############
    # define the location of a work area
    max_shot_work_area:
        definition: '@shot_work_file_root/3dsmax'
        root_name: 'project_storage'

    max_asset_work_area:
        definition: '@asset_work_file_root/3dsmax'
        root_name: 'asset_storage'

    # The location of WIP files
    max_shot_work:
        definition: '@max_shot_work_area/{Shot}_{task_name}[_{name}]_v{version}.max'
        root_name: 'project_storage'

    max_asset_work:
        definition: '@max_asset_work_area/{Asset}_{task_name}[_{name}]_v{version}.max'
        root_name: 'asset_storage'

    # The location of backups of WIP files
    max_shot_snapshot:
        definition: '@max_shot_work_area/snapshots/{Shot}_{task_name}[_{name}]_v{version}.{timestamp}.max'
        root_name: 'project_storage'

    max_asset_snapshot:
        definition: '@max_asset_work_area/snapshots/{Asset}_{task_name}[_{name}]_v{version}.{timestamp}.max'
        root_name: 'asset_storage'

    # define the location of a publish area
    max_shot_publish_area:
        definition: '@shot_work_file_publish_root/3dsmax'
        root_name: 'project_storage'

    max_asset_publish_area:
        definition: '@asset_work_file_publish_root/3dsmax'
        root_name: 'asset_storage'

    # The location of published max files
    max_shot_publish:
        definition: '@max_shot_publish_area/{Shot}_{task_name}_v{version}.max'
        root_name: 'project_storage'

    max_asset_publish:
        definition: '@max_asset_publish_area/{Asset}_{task_name}_v{version}.max'
        root_name: 'asset_storage'

    ###########
    # Renders #
    ###########
    # Render roots.
    max_shot_render_root:
        definition: '@shot_render_root/3dsmax'
        root_name: 'project_storage'

    max_asset_render_root:
        definition: '@asset_render_root/3dsmax'
        root_name: 'asset_storage'

    # Render Publish roots.
    max_shot_render_publish_root:
        definition: '@shot_render_publish_root/3dsmax'
        root_name: 'project_storage'

    max_asset_render_publish_root:
        definition: '@asset_render_publish_root/3dsmax'
        root_name: 'asset_storage'

    # version outputs.
    # EXRs
    max_shot_render_exr:
        definition: '@max_shot_render_publish_root/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.exr'
        root_name: 'project_storage'

    max_asset_render_exr:
        definition: '@max_asset_render_publish_root/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.exr'
        root_name: 'asset_storage'

    # JPGs
    max_shot_render_jpg:
        definition: '@max_shot_render_publish_root/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.jpg'
        root_name: 'project_storage'

    max_asset_render_jpg:
        definition: '@max_asset_render_publish_root/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.jpg'
        root_name: 'asset_storage'

    # PNGs
    max_shot_render_png:
        definition: '@max_shot_render_publish_root/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.png'
        root_name: 'project_storage'

    max_asset_render_png:
        definition: '@max_asset_render_publish_root/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.png'
        root_name: 'asset_storage'

#    max_shot_render_exr_pub:
#        definition: '@shot_render_root/3dsmax/{task_name}/publish/{Shot}_{task_name}_v{version}/{Shot}_{task_name}_v{version}.exr'
#        root_name: 'project_storage'

    ##########
    # Caches #
    ##########
    # 3dMax Simulations outputs.
    max_shot_sim_ffx:
        definition: '@shot_cache_root/3dsmax/sim/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.fxd'
        root_name: 'caches'

    max_asset_sim:
        definition: '@asset_cache_root/3dsmax/sim/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}.fxd'
        root_name: 'caches'

    # 3dMax Cache output
    max_shot_cache_alembic:
        definition: '@shot_cache_root/3dsmax/alembic/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.abc'
        root_name: 'caches'

    max_asset_cache_alembic:
        definition: '@asset_cache_root/3dsmax/alembic/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}.abc'
        root_name: 'caches'

    ##########
    # Review #
    ##########
    # Review outputs.
    max_shot_quicktime:
        definition: '@shot_review_root/3dsmax/quickdaily/{Shot}_{task_name}_v{version}.mov'
        root_name: 'review'

    max_asset_quicktime:
        definition: '@asset_review_root/3dsmax/quickdaily/{Shot}_{task_name}_v{version}.mov'
        root_name: 'review'

    max_shot_render_movie:
        definition: '@shot_review_root/3dsmax/review/{Shot}_{task_name}_v{version}.mov'
        root_name: 'review'

    max_asset_render_movie:
        definition: '@asset_review_root/3dsmax/review/{Shot}_{task_name}_v{version}.mov'
        root_name: 'review'

    # Filmstrips.
    max_shot_render_filmstrip:
        definition: '@shot_review_root/3dsmax/filmstrip/{Shot}_{task_name}_v{version}.png'
        root_name: 'review'

    max_asset_render_filmstrip:
        definition: '@asset_review_root/3dsmax/filmstrip/{Shot}_{task_name}_v{version}.png'
        root_name: 'review'
