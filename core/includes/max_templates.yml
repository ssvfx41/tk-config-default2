keys:
    3dsmax.render.output:
        alias: output
        type: str
        filter_by: alphanumeric

    3dsmax.cache.output:
        alias: output
        type: str
        filter_by: alphanumeric

paths:
    # ### Shot Work Templates
    # define the location of a work area
    max_shot_work_area:
        definition: '@shot_task_root/work/3dsmax'
        root_name: 'project_storage'

    # define the location of a publish area
    max_shot_publish_area:
        definition: '@shot_task_root/publish/3dsmax'
        root_name: 'project_storage'

    # The location of WIP files
    max_shot_work:
        definition: '@shot_task_root/work/3dsmax/{Shot}_{task_name}[_{name}]_v{version}.max'
        root_name: 'project_storage'

    # The location of backups of WIP files
    max_shot_snapshot:
        definition: '@shot_task_root/work/3dsmax/snapshots/{Shot}_{task_name}[_{name}]_v{version}.{timestamp}.max'
        root_name: 'project_storage'

    # The location of published max files
    max_shot_publish:
        definition: '@shot_task_root/publish/3dsmax/{Shot}_{task_name}_v{version}.max'
        root_name: 'project_storage'

    # ### Asset Work Templates
    # define the location of a work area
    max_asset_work_area:
        definition: '@asset_task_root/work/3dsmax'
        root_name: 'asset_storage'

    # define the location of a publish area
    max_asset_publish_area:
        definition: '@asset_task_root/publish/3dsmax'
        root_name: 'asset_storage'

    # The location of WIP files
    max_asset_work:
        definition: '@asset_task_root/work/3dsmax/{Asset}_{task_name}[_{name}]_v{version}.max'
        root_name: 'asset_storage'

    # The location of backups of WIP files
    max_asset_snapshot:
        definition: '@asset_task_root/work/3dsmax/snapshots/{Asset}_{task_name}[_{name}]_v{version}.{timestamp}.max'
        root_name: 'asset_storage'

    # The location of published max files
    max_asset_publish:
        definition: '@asset_task_root/publish/3dsmax/{Asset}_{task_name}_v{version}.max'
        root_name: 'asset_storage'

    # ### Shot Output Templates
    # version output
    max_shot_render_exr:
        definition: '@shot_render_root/3dsmax/{task_name}/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.exr'
        root_name: 'project_storage'

    max_shot_render_jpg:
        definition: '@shot_render_root/3dsmax/{task_name}/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.jpg'
        root_name: 'project_storage'

    max_shot_render_png:
        definition: '@shot_render_root/3dsmax/{task_name}/version/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.png'
        root_name: 'project_storage'

    max_shot_render_exr_pub:
        definition: '@shot_render_root/3dsmax/{task_name}/publish/{Shot}_{task_name}_v{version}/{Shot}_{task_name}_v{version}.exr'
        root_name: 'project_storage'

    # 3dMax Simulations output
    max_shot_sim_ffx:
        definition: '@shot_root/3dsmax/{task_name}/caches/sim/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.fxd'
        root_name: 'caches'

    # 3dMax Cache output
    max_shot_cache_alembic:
        definition: '@shot_root/3dsmax/{task_name}/caches/geometry/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}/{Shot}_{task_name}[_{3dsmax.render.output}]_v{version}.abc'
        root_name: 'caches'

     # review output
    max_shot_quicktime_quick:
        definition: '@temp_shot_root/3dsmax/{task_name}/review/quickdaily/{Shot}_v{version}_{iteration}.mov'
        root_name: 'project_storage'

    max_shot_render_movie:
        definition: '@temp_shot_root/3dsmax/{task_name}/review/{Shot}_review/{Shot}_review_v{version}.mov'
        root_name: 'project_storage'

    max_shot_render_filmstrip:
        definition: '@temp_shot_root/3dsmax/{task_name}/review/{Shot}_revie/{Shot}_review_v{version}.png'
        root_name: 'project_storage'

    # ### Asset Output Templates
    # Render location for asset renders
    max_asset_render_exr:
        definition: '@asset_render_root/3dsmax/{task_name}/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.exr'
        root_name: 'asset_storage'

    max_asset_render_jpg:
        definition: '@asset_render_root/3dsmax/{task_name}/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.jpg'
        root_name: 'asset_storage'

    max_asset_render_png:
        definition: '@asset_render_root/3dsmax/{task_name}/version/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.render.output}]_v{version}.png'
        root_name: 'asset_storage'

    max_asset_render_exr_pub:
        definition: '@asset_render_root/3dsmax/{task_name}/version/{Asset}_{task_name}_v{version}/{Asset}_{task_name}_v{version}.exr'
        root_name: 'asset_storage'

    # 3dMax Simulations output
    max_asset_sim:
        definition: '@asset_root/3dsmax/{task_name}/caches/sim/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}.fxd'
        root_name: 'caches'

    # 3dMax Cache output 
    max_asset_cache_alembic:
        definition: '@asset_root/3dsmax/{task_name}/caches/geometry/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}/{Asset}_{task_name}[_{3dsmax.cache.output}]_v{version}.abc'
        root_name: 'caches'
