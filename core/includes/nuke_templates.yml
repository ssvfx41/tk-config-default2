keys:
    # Represents the optional output name for frames written by the Shotgun Write Node
    # TODO: Can't find any references, can this be replaced with {name}?
    nuke.output:
        alias: output
        type: str
        filter_by: alphanumeric

paths:
    ##############
    # Work Files #
    ##############
    # define the location of a work area
    nuke_shot_work_area:
        definition: '@shot_work_file_root/nuke'
        root_name: 'project_storage'

    nuke_asset_work_area:
        definition: '@asset_work_file_root/nuke'
        root_name: 'asset_storage'

    # The location of WIP script files
    nuke_shot_work:
        definition: '@nuke_shot_work_area/{Shot}_{task_name}[_{name}]_v{version}.nk'
        root_name: 'project_storage'

    nuke_asset_work:
        definition: '@nuke_asset_work_area/{Asset}_{task_name}[_{name}]_v{version}.nk'
        root_name: 'asset_storage'

    # The location of backups of WIP files
    nuke_shot_snapshot:
        definition: '@nuke_shot_work_area/snapshots/{Shot}_{task_name}[_{name}]_v{version}.{timestamp}.nk'
        root_name: 'project_storage'

    nuke_asset_snapshot:
        definition: '@nuke_asset_work_area/snapshots/{Asset}_{task_name}[_{name}]_v{version}.{timestamp}.nk'
        root_name: 'asset_storage'

    # define the location of a publish area
    nuke_shot_publish_area:
        definition: '@shot_work_file_publish_root/nuke'
        root_name: 'project_storage'

    nuke_asset_publish_area:
        definition: '@asset_work_file_publish_root/nuke'
        root_name: 'asset_storage'

    # The location of published nuke script files
    nuke_shot_publish:
        definition: '@nuke_shot_publish_area/{Shot}_{task_name}[_{name}]_v{version}.nk'
        root_name: 'project_storage'

    nuke_asset_publish:
        definition: '@nuke_asset_publish_area/{Asset}_{task_name}[_{name}]_v{version}.nk'
        root_name: 'asset_storage'

    ###########
    # Exports #
    ###########
    # Retime FCurve exports.
    shot_retime_curve:
        definition: '@shot_export_publish_root/nuke/retime/{Shot}_[{name}_]v{version}.txt'
        root_name: 'project_storage'

    ###########
    # Renders #
    ###########
    # Render working location.
    nuke_shot_render_root:
        definition: '@shot_render_root/nuke'
        root_name: 'project_storage'

    nuke_asset_render_root:
        definition: '@asset_render_root/nuke'
        root_name: 'asset_storage'

    # Working version outputs.
    # JPEGs
    nuke_shot_render_jpeg:
        definition: '@nuke_shot_render_root/version/{Shot}_{task_name}[_{nuke.output}]_v{version}/{Shot}_{task_name}[_{nuke.output}]_v{version}.{SEQ}.jpeg'
        root_name: 'project_storage'

    nuke_asset_render_jpeg:
        definition: '@nuke_asset_render_root/version/{Asset}_{task_name}[_{nuke.output}]_v{version}/{Asset}_{task_name}[_{nuke.output}]_v{version}.{SEQ}.jpeg'
        root_name: 'asset_storage'

    # DPXs
    nuke_shot_render_dpx:
        definition: '@nuke_shot_render_root/version/{Shot}_{task_name}[_{nuke.output}]_v{version}/{Shot}_{task_name}[_{nuke.output}]_v{version}.{SEQ}.dpx'
        root_name: 'project_storage'

    nuke_asset_render_dpx:
        definition: '@nuke_asset_render_root/version/{Asset}_{task_name}[_{nuke.output}]_v{version}/{Asset}_{task_name}[_{nuke.output}]_v{version}.{SEQ}.dpx'
        root_name: 'asset_storage'

    # EXRs
    nuke_shot_render_exr:
        definition: '@nuke_shot_render_root/version/{Shot}_{task_name}[_{nuke.output}]_v{version}/{Shot}_{task_name}[_{nuke.output}]_v{version}.{SEQ}.exr'
        root_name: 'project_storage'

    nuke_asset_render_exr:
