        root_name: 'asset_storage'

    # Element outputs.
    # JPEGs
    nuke_shot_render_element_jpeg:
        definition: '@nuke_shot_render_root/elem/{Shot}_elem[_{nuke.output}]_v{version}/{Shot}_elem[_{nuke.output}]_v{version}.{SEQ}.jpeg'
