#
# This file is one of the central points in the Shotgun Pipeline Toolkit configuration and
# a counterpart to the folder configuration structure.
#
# The folder structure underneath the project folder is used to create folders on disk -
# templates.yml (this file) refers to those folders. Therefore, the two files need to be
# in sync. This file contains an overview of all locations that are used by Sgtk.
#
# Whenever an app or an engine refers to a location on disk, it is using an entry defined in
# this file. For more information, see the Shotgun Pipeline Toolkit Documentation.

keys:
# TODO: Not in use, commenting out and will remove after testing.
#    3dequalizer.lens_name:
#        type: str
#        filter_by: '^[0-9a-zA-Z_]+$'

#    3dequalizer.camera_name:
#        type: str
#        filter_by: '^[0-9a-zA-Z_]+$'

#    3dequalizer.dist_name:
#        type: str
#        filter_by: '^[0-9a-zA-Z_]+$'

#    3dequalizer.pointGroup_name:
#        type: str
#        filter_by: '^[0-9a-zA-Z_]+$'

#    # 3dequalizer supports two extension types.
#    3dequalizer_extension:
#        type: str
#        choices:
#            3de: 3dequalizer Project (.3de)
#        default: 3de
#        alias: extension

    3DESEQ:
        type: sequence
        format_spec: "04"
        default: "####"
        alias: 3DESEQ

    3dequalizer_camera_extension:
        type: str
        choices:
            mel: Maya MEL
            abc: Alembic
        default: mel
        alias: extension

paths:
    ##############
    # Work Files #
    ##############
    # Work file folder used in the File Open app.
    3de_shot_work_area:
        definition: '@shot_work_file_root/3de'
        root_name: 'project_storage'

    3de_asset_work_area:
        definition: '@asset_work_file_root/3de'
        root_name: 'asset_storage'

    # Artist work file templates.
    3de_shot_work:
        definition: '@3de_shot_work_area/{Shot}_{task_name}_[{name}_]v{version}.3de'
        root_name: 'project_storage'

    3de_asset_work:
        definition: '@3de_asset_work_area/{Asset}_{task_name}_[{name}_]v{version}.3de'
        root_name: 'asset_storage'

    # Location of temporary snapshots.
    3de_shot_snapshot:
        definition: '@3de_shot_work_area/snapshots/{Shot}_{task_name}_[{name}_]v{version}.{timestamp}.3de'
        root_name: 'project_storage'

    3de_asset_snapshot:
        definition: '@3de_asset_work_area/snapshots/{Asset}_{task_name}_[{name}_]v{version}.{timestamp}.3de'
        root_name: 'asset_storage'

    # Publish folder used in File Open app.
    3de_shot_publish_area:
        definition: '@shot_work_file_publish_root/3de'
        root_name: 'project_storage'

    3de_asset_publish_area:
        definition: '@asset_work_file_publish_root/3de'
        root_name: 'asset_storage'

    # Location of published work files.
    3de_shot_publish:
        definition: '@3de_shot_publish_area/{Shot}_{task_name}_[{name}_]v{version}.3de'
        root_name: 'project_storage'

    3de_asset_publish:
        definition: '@3de_asset_publish_area/{Asset}_{task_name}_[{name}_]v{version}.3de'
        root_name: 'asset_storage'

    # Location of distort Nuke files.
    3de_shot_dist_publish:
        definition: '@shot_work_file_publish_root/nuke/{Shot}_{task_name}_distNode_[{name}_]v{version}.nk'
        root_name: 'project_storage'

    3de_shot_distRender_publish:
        definition: '@shot_work_file_publish_root/nuke/{Shot}_{task_name}_distRender_[{name}_]v{version}.nk'
        root_name: 'project_storage'

    ###########
    # Renders #
    ###########
    3de_shot_render_publish_root:
        definition: '@shot_render_publish_root/3de'
        root_name: 'project_storage'

    # Undistorted renders.
    3de_shot_undistort_plates_publish:
        definition: '@3de_shot_render_publish_root/undistort/{Shot}_{task_name}_[{name}_]undistort_v{version}/{Shot}_{task_name}_undistort_[{name}_]v{version}.{3DESEQ}.jpg'
        root_name: 'project_storage'

    # Playblast renders.
    3de_shot_playblast_publish:
        definition: '@3de_shot_render_publish_root/playblast/{Shot}_{task_name}_[{name}_]pb_v{version}/{Shot}_{task_name}[_{name}]_pb_v{version}.{3DESEQ}.jpg'
        root_name: 'project_storage'

    # Cones renders.
    3de_shot_cones_publish:
        definition: '@3de_shot_render_publish_root/cones/{Shot}_{task_name}_[{name}_]cones_v{version}/{Shot}_{task_name}_cones_[{name}_]v{version}.{3DESEQ}.jpg'
        root_name: 'project_storage'

    # Wire renders.
    3de_shot_wire_publish:
        definition: '@3de_shot_render_publish_root/wire/{Shot}_{task_name}_[{name}_]wire_v{version}/{Shot}_{task_name}_wire_[{name}_]v{version}.{3DESEQ}.jpg'
        root_name: 'project_storage'

    ####################
    # Exports / Caches #
    ####################
    # 3DE caches root.
#    3de_shot_cache_root:
#        definition: '@shot_cache_root/3de'
#        root_name: 'caches'
#
#    3de_asset_cache_root:
#        definition: '@asset_cache_root/3de'
#        root_name: 'caches'

    3de_shot_export_publish_root:
        definition: '@shot_export_publish_root/3de'
        root_name: 'project_storage'

    3de_asset_export_publish_root:
        definition: '@asset_export_publish_root/3de'
        root_name: 'asset_storage'

    # Published Cameras.
    3de_shot_camera_publish:
        definition: '@3de_shot_export_publish_root/camera/{Shot}_{task_name}_camera-cache_[{name}_]v{version}.{3dequalizer_camera_extension}'
        root_name: 'project_storage'

    3de_asset_camera_publish:
        definition: '@3de_asset_export_publish_root/camera/{Asset}_{task_name}_camera-cache_[{name}_]v{version}.{3dequalizer_camera_extension}'
        root_name: 'asset_storage'

    # Object exports.
    3de_shot_export_obj:
        definition: '@3de_shot_export_publish_root/obj/{Shot}_{task_name}_v{version}.obj'
        root_name: 'project_storage'

    # Published lens exports.
    3de_shot_lens_publish:
        definition: '@3de_shot_export_publish_root/lens/{Shot}_{task_name}_[{name}_]v{version}.txt'
        root_name: 'project_storage'

    3de_asset_lens_publish:
        definition: '@3de_asset_export_publish_root/lens/{Asset}_{task_name}_[{name}_]v{version}.txt'
        root_name: 'asset_storage'

#    # TODO: Not in use, commenting out and will remove after testing.
