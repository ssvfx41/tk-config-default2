#
# This file is one of the central points in the Shotgun Pipeline Toolkit configuration and
# a counterpart to the folder configuration structure.
#
# The folder structure underneath the project folder is used to create folders on disk -
# templates.yml (this file) refers to those folders. Therefore, the two files need to be
# in sync. This file contains an overview of all locations that are used by Sgtk.
#
# Whenever an app or an engine refers to a location on disk, it is using an entry defined in
# this file. For more information, see the Shotgun Pipeline Toolkit Documentation.

# Houdini templates
# easier to debug
includes:
- ./includes/houdini_templates.yml
- ./includes/maya_templates.yml
- ./includes/nuke_templates.yml
- ./includes/max_templates.yml
- ./includes/photoshop_templates.yml
- ./includes/mari_templates.yml
- ./includes/outsource_templates.yml
- ./includes/submitter_templates.yml
- ./includes/3dequalizer_templates.yml
#
# The keys section contains the definitions for all the different keys that are being
# used by Sgtk. A key is a magic token that is replaced by a value at runtime, for example
# {Shot}. The section below tells Sgtk which data types and formats to expect for each key.
#


keys:
    Sequence:
        type: str
    Shot:
        type: str
    Rush:
        type: str
    ext:
        type: str
    sg_asset_type:
        type: str
    ampm:
        type: str
    Asset:
        type: str
    Playlist:
        type: str
    name:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'
    process:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'
    Codec:
        type: str
        filter_by: alphanumeric
    iteration:
        type: int
    version:
        type: int
        format_spec: "03"
    version_four:
       type: int
       format_spec: "04"
       alias: version
    timestamp:
        type: str
        default: 1970-01-01-00-00-00
        filter_by: '^[-0-9]+$'
    width:
        type: int
    height:
        type: int

    SEQ:
        type: sequence
        format_spec: "04"
    eye:
        type: str

    Shot_Sequence:
        type: str
        shotgun_entity_type: Sequence
        shotgun_field_name: code

    # for rendering tiles
    tile_x:
        type: int
        format_spec: "02"
    tile_y:
        type: int
        format_spec: "02"
    tile_index:
        type: int
        format_spec: "02"

    login:
        type: str
        shotgun_entity_type: HumanUser
        shotgun_field_name: login
    
    vendor:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'

    # these are used by the Hiero exporter and pipeline
    YYYY:
        type: int
        format_spec: "04"
    MM:
        type: int
        format_spec: "02"
    DD:
        type: int
        format_spec: "02"
        alias: DD
    project:
        type: str

    # For Maya and Houdini passes
    pass_group:
      type: str
      filter_by: alphanumeric
      default: beauty

    # These are used for the Mari UDIM pipeline:
    UDIM:
        type: sequence
        default: "<UDIM>"
    asset_name:
        type: str
        shotgun_entity_type: Asset
        shotgun_field_name: code
    shot_name:
        type: str
        shotgun_entity_type: Shot
        shotgun_field_name: code
    task_name:
        type: str
        shotgun_entity_type: Task
        shotgun_field_name: content

    # Maya supports two extension types.
    camera_extension:
        type: str
        choices:
            abc: Alembic (.abc)
            fbx: fbx (.fbx)
        default: abc
        alias: extension

    sc_template_extension:
        type: str
        choices:
            ma: Maya (.ma)
            hip: Houdini (.hip)
            cpio: Houdini (.cpio)
            hda: Houdini (.hda)
            otl: Houdini (.otl)
            json: JSON (.json)
            py: Python (.py)
        alias: extension

    dcc:
        type: str
        choices:
            3de: 3DEqualizer
            maya: Maya
            houdini: Houdini

    sc_template_name:
        type: str
        filter_by: '^[0-9a-zA-Z- ]+$'

# The paths section contains all the the key locations where files are to be stored
# by Sgtk Apps. Each path is made up of several keys (like {version} or {shot}) and
# these are defined in the keys section above.
#
# Apps use these paths as part of their configuration to define where on disk
# different files should go.
#
# In this default configuration, all of the root_name keys will be set to 'primary'.
# This is because the default configuration stores all its production data in a single
# tree and hence uses a single root folder on disk. If you wanted to extend the
# configuration to span multiple root points, for example because you want to store
# renders on a different server, you could define an additional root in Shotgun, and
# then switch any relevant templates to point to that one instead.

paths:
    # Common  path definitions to use as shorthand in order to avoid repetitive and verbose
    # templates. This also makes it easy to change any of the common root paths and have the
    # changes apply to all templates that use them.
    #
    # These don't require the standard formatting (with definition and root_name) because they
    # will be set within each template that uses the alias.

    # Shot / Asset entity root folder.
    shot_root:
        definition: 'shots/{Sequence}/{Shot}'
        root_name: 'project_storage'

    asset_root:
        definition: 'assets/{sg_asset_type}/{Asset}'
        root_name: 'asset_storage'

    # ---------------------------------
    # TODO: Instead of one task root we now have several based on what data is
    #   in that location. So there is a workFile, export, render and review root.
    #   So these maybe can be removed in favour of more specific data root templates.
    shot_task_root:
        definition: 'shots/{Sequence}/{Shot}/pipeline_task/{task_name}'
        root_name: 'project_storage'
    asset_task_root:
        definition: 'assets/{sg_asset_type}/{Asset}/pipeline_task/{task_name}'
        root_name: 'asset_storage'
    # ---------------------------------
    ##############
    # Work Files #
    ##############
    # Artist working file roots
    shot_work_file_root:
        definition: '@shot_root/workFile/{task_name}/work'
        root_name: 'project_storage'

    asset_work_file_root:
        definition: '@asset_root/workFile/{task_name}/work'
        root_name: 'asset_storage'

    # Artist work file publish roots
    shot_work_file_publish_root:
        definition: '@shot_root/workFile/{task_name}/publish'
        root_name: 'project_storage'

    asset_work_file_publish_root:
        definition: '@asset_root/workFile/{task_name}/publish'
        root_name: 'asset_storage'

    ###########
    # Renders #
    ###########
    # Artist working render roots
    shot_render_root: 
        definition: '@shot_root/render/{task_name}/work'
        root_name: 'project_storage'

    asset_render_root:
        definition: '@asset_root/render/{task_name}/work'
        root_name: 'asset_storage'

    # Artist publish render roots
    shot_render_publish_root:
        definition: '@shot_root/render/{task_name}/publish'
        root_name: 'project_storage'

    asset_render_publish_root:
        definition: '@asset_root/render/{task_name}/publish'
        root_name: 'asset_storage'

    ####################
    # Exports / Caches #
    ####################
    # Artist working export root.
    shot_export_root:
        definition: '@shot_root/export/{task_name}'
        root_name: 'project_storage'

    asset_export_root:
        definition: '@asset_root/export/{task_name}'
        root_name: 'asset_storage'

    # Artist published exports root. Published caches and exports are saved to the
    # 'caches' storage. This is because exported data can be reconstructed from the
    # source work file and so the data is considered temporary and is removed after
    # a project has wrapped.
    shot_cache_root:
        definition: '@shot_root/{task_name}'
        root_name: 'caches'

    asset_cache_root:
        definition: '@asset_root/{task_name}'
        root_name: 'caches'

    # TODO: Move to Nuke templates
    # Retime FCurve exports.
    shot_retime_curve:
        definition: '@shot_export_root/nuke/retime/[{name}_]v{version}/{Shot}_[{name}_]v{version}.txt'
        root_name: 'project_storage'

    ########
    # Temp #
    ########
    # Entity temp data root.
    temp_shot_root:
        definition: '@shot_root/temp'
        root_name: 'project_storage'

    temp_asset_root:
        definition: '@asset_root/temp'
        root_name: 'asset_storage'

    # Entity temp render root.
    temp_shot_render_root:
        definition: '@temp_shot_root/render/{task_name}'
        root_name: 'project_storage'

    temp_asset_render_root:
        definition: '@temp_asset_root/render/{task_name}'
        root_name: 'asset_storage'

    # --------------------------------
    # JSON data files saved during artist submission.
    # TODO: These can be removed once the submitter has been updated to use the project_config api.
    info_json_file:
        definition: '@temp_shot_root/json/{Shot}_{task_name}_[{name}_]v{version}.json'
        root_name: 'project_storage'

    alembic_shot_json:
        definition: '@temp_shot_root/json/{Shot}_{task_name}_alembic_v{version}.json'
        root_name: 'project_storage'

    alembic_asset_json:
        definition: '@temp_asset_root/json/{Asset}_{task_name}_alembic_v{version}.json'
        root_name: 'asset_storage'
