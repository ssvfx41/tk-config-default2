#
# This file is one of the central points in the Shotgun Pipeline Toolkit configuration and
# a counterpart to the folder configuration structure.
#
# The folder structure underneath the project folder is used to create folders on disk -
# templates.yml (this file) refers to those folders. Therefore, the two files need to be
# in sync. This file contains an overview of all locations that are used by Sgtk.
#
# Whenever an app or an engine refers to a location on disk, it is using an entry defined in
# this file. For more information, see the Shotgun Pipeline Toolkit Documentation.

# Houdini templates
# easier to debug
includes:
- ./includes/houdini_templates.yml
- ./includes/maya_templates.yml
- ./includes/nuke_templates.yml
- ./includes/max_templates.yml
- ./includes/photoshop_templates.yml
- ./includes/mari_templates.yml
- ./includes/outsource_templates.yml
- ./includes/submitter_templates.yml
- ./includes/3dequalizer_templates.yml
#
# The keys section contains the definitions for all the different keys that are being
# used by Sgtk. A key is a magic token that is replaced by a value at runtime, for example
# {Shot}. The section below tells Sgtk which data types and formats to expect for each key.
#


keys:
    Sequence:
        type: str
        shotgun_entity_type: Shot
        shotgun_field_name: sg_sequence.Sequence.code
    Shot:
        type: str
        shotgun_entity_type: Shot
        shotgun_field_name: code
    Rush:
        type: str    
    ext:
        type: str    
    sg_asset_type:
        type: str
    ampm:
        type: str    
    Asset:
        type: str
    Playlist:
        type: str        
    name:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'
    process:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'
    Codec:
        type: str
        filter_by: alphanumeric        
    iteration:
        type: int
    version:
        type: int
        format_spec: "03"
    version_four:
       type: int
       format_spec: "04"
       alias: version
    timestamp:
        type: str
        default: 1970-01-01-00-00-00
        filter_by: '^[-0-9]+$'
    width:
        type: int
    height:
        type: int

    # SEQ vs frame_padding
    # type: sequence always appears in output paths even when set as optional in
    # the template.
    # Use "frame_padding" for output templates as it is correctly treated as optional.
    # Use "SEQ" for templates that are always sequences, or for input templates to
    #   correctly extract frame padding.
    SEQ:
        type: sequence
        format_spec: "04"
    SEQ6:
        type: sequence
        format_spec: "06"
    frame_padding:
        type: str

    eye:
        type: str

    Shot_Sequence:
        type: str
        shotgun_entity_type: Sequence
        shotgun_field_name: code

    # for rendering tiles
    tile_x:
        type: int
        format_spec: "02"
    tile_y:
        type: int
        format_spec: "02"
    tile_index:
        type: int
        format_spec: "02"

    login:
        type: str
        shotgun_entity_type: HumanUser
        shotgun_field_name: login
    
    vendor:
        type: str
        filter_by: '^[0-9a-zA-Z-]+$'

    # these are used by the Hiero exporter and pipeline
    YYYY:
        type: int
        format_spec: "04"
    MM:
        type: int
        format_spec: "02"
    DD:
        type: int
        format_spec: "02"
        alias: DD
    project:
        type: str

    # For Maya and Houdini passes
    pass_group:
      type: str
      filter_by: alphanumeric
      default: beauty

    # These are used for the Mari UDIM pipeline:
    UDIM:
        type: sequence
        default: "<UDIM>"
    asset_name:
        type: str
        shotgun_entity_type: Asset
        shotgun_field_name: code
    shot_name:
        type: str
        shotgun_entity_type: Shot
        shotgun_field_name: code
    task_name:
        type: str
        shotgun_entity_type: Task
        shotgun_field_name: content

    # Maya supports two extension types.
    camera_extension:
        type: str
        choices:
            abc: Alembic (.abc)
            fbx: fbx (.fbx)
        default: abc
        alias: extension

    sc_template_extension:
        type: str
        choices:
            ma: Maya (.ma)
            hip: Houdini (.hip)
            cpio: Houdini (.cpio)
            hda: Houdini (.hda)
            otl: Houdini (.otl)
            json: JSON (.json)
            py: Python (.py)
        alias: extension

    # image extension descriptor.
    image_extension:
        type: str
        choices:
            jpg: Joint Photographic Group (.JPG)
            jpeg: Joint Photographic Expert Group (.jpeg)
            exr: OpenEXR (.exr)
            dpx: Digital Picture Exchange (.dpx)
        default: exr

    # movie extension descriptor.
    movie_extension:
        type: str
        choices:
            mov: QuickTime File Format (.mov)
            mp4: MPEG-4 Part 14 (.mp4)
        default: mov

    # image extension descriptor.
    work_extension:
        type: str
        choices:
            3de: 3dequalizer file (.3de)
            hip: Houdini file (.hip)
            hipnc: Houdini file (.hipnc)
            ma: Maya file (.ma)
            mb: Maya binary file (.mb)
            nk: Nuke file (.nk)
            psd: Photoshop file (.psd)
            psb: Photoshop file (.psb)
        default: nk

    export_extension:
        type: str
        choices:
            abc: (.abc)
            ass: (.ass)
            bgeo: (.bgeo)
            bgeosc: (.bgeosc)
            fxd: (.fxd)
            mcx: (.mcx)
            obj: (.obj)
            txt: (.txt)
        default: abc

    element_type:
        type: str
        choices:
            denoise: denoise
            element: element
            smartvector: smartvector
            stmap: stmap
            test: test
        default: element

    export_type:
        type: str
        choices:
            alembic: alembic
            bifrost: bifrost
            geometry: geometry
            n_cache: n_cache
            obj: obj
            standin: standin
        default: alembic

    export_group:
        type: str

    dcc:
        type: str
        choices:
            3de: 3D Equalizer
            3dsmax: 3ds Max
            houdini: Houdini
            mari: Mari
            maya: Maya
            nuke: Nuke
            psd: Photoshop

    descriptor:
        type: str
        filter_by: '^[0-9a-zA-Z- ]+$'

    sc_template_name:
        type: str
        filter_by: '^[0-9a-zA-Z- ]+$'

#
# The paths section contains all the the key locations where files are to be stored
# by Sgtk Apps. Each path is made up of several keys (like {version} or {shot}) and
# these are defined in the keys section above.
#
# Apps use these paths as part of their configuration to define where on disk
# different files should go.
#
# In this default configuration, all of the root_name keys will be set to 'primary'.
# This is because the default configuration stores all its production data in a single
# tree and hence uses a single root folder on disk. If you wanted to extend the
# configuration to span multiple root points, for example because you want to store
# renders on a different server, you could define an additional root in Shotgun, and
# then switch any relevant templates to point to that one instead.
#

